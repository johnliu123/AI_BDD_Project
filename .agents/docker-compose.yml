version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: one-a-two-b-game-postgres
    environment:
      POSTGRES_DB: one_a_two_b_game_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
